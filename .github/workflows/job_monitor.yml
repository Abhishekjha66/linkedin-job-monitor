name: LinkedIn Job Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-telegram-bot
          python -m playwright install chromium

      - name: Create .env
        run: |
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" > .env
          echo "CHAT_IDS=${{ secrets.CHAT_IDS }}" >> .env
          echo "CHECK_INTERVAL=15" >> .env

      - name: Run Job Monitor
        run: python -B src/main.py

      - name: Save sent job history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sent_jobs.json data/jobs.json

          if git diff --cached --quiet; then
            echo "No job history changes to commit."
          else
            git commit -m "Update job monitor history"
            git push
          fi